# XcodeGen spec for the toolbox: one iPhone app holding every tool, so the phone spends one of
# the free Apple account's three app slots and one renewal on all of them.
# Nothing is copied: each tool's sources come straight from its own app folder, minus that app's
# @main entry file, and the standalone apps still build from the same files.
# Tools: the album (apps/album-ios), the miner status (apps/miner-status-ios), the desk remote
# (apps/desk-remote-ios) and the thermometers (apps/thermo-ios), each with its own tab.
# Generate on a Mac from this directory with `xcodegen generate`; see scripts/build.sh.
name: Toolbox
options:
  bundleIdPrefix: org.personal.lightbox
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: "17.0"
packages:
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2.git
    exactVersion: 4.0.3
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    # iPhone and iPad. Also set on the app target below: XcodeGen's iOS target preset sets "1,2"
    # there, which is what every IPA up to 0.6.1 shipped although this line said "1".
    TARGETED_DEVICE_FAMILY: "1,2"
    # Continues the album's numbering: the toolbox installs over the album (0.3.2 build 5).
    # 0.5: the desk remote joined as the third tab. 0.5.1: memory, tab and heartbeat in the
    # album's diagnostics (four unexplained ends on 11/01). 0.5.2: the album no longer ends when a
    # folder is opened on a connection the NAS closed (SIGPIPE ignored, reconnect and retry once).
    # 0.5.3: a NAS not answering over ZeroTier is tried up to five times before the album gives up.
    # 0.6: the thermometers joined as the fourth tab.
    MARKETING_VERSION: "0.6.1"
    CURRENT_PROJECT_VERSION: "16"
targets:
  # Named Lightbox, as the album app it replaces: the same bundle identifier, executable and
  # Swift module, so the album's unit tests (`@testable import Lightbox`) run here unchanged.
  Lightbox:
    type: application
    platform: iOS
    sources:
      - path: Toolbox
        excludes: [Info.plist]
      - path: ../album-ios/Lightbox
        excludes: [LightboxApp.swift, Info.plist]
      - path: ../miner-status-ios/iOSApp
        excludes: [MinerStatusApp.swift, Info.plist, zh-Hant.lproj]
      - path: ../miner-status-ios/fixtures/demo-running.json
        buildPhase: resources
      - path: ../desk-remote-ios/iOSApp
        excludes: [DeskRemoteApp.swift, Info.plist, zh-Hant.lproj]
      - path: ../thermo-ios/iOSApp
    dependencies:
      - target: MinerStatusCore
      - target: DeskRemoteCore
      - target: ThermoCore
      - sdk: Charts.framework
      - package: AMSMB2
        embed: true
      - framework: ../album-ios/Vendor/MobileVLCKit.xcframework
        embed: true
      - sdk: QuartzCore.framework
      - sdk: CoreText.framework
      - sdk: AVFoundation.framework
      - sdk: Security.framework
      - sdk: CFNetwork.framework
      - sdk: AudioToolbox.framework
      - sdk: OpenGLES.framework
      - sdk: CoreGraphics.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: libc++.tbd
      - sdk: libxml2.tbd
      - sdk: libz.tbd
      - sdk: libbz2.tbd
      - sdk: libiconv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.lightbox.album
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Toolbox/Info.plist
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "decoder-*.avi"
    scheme:
      gatherCoverageData: false
      testTargets:
        - LightboxTests
        - MinerStatusCoreTests
        - DeskRemoteCoreTests
        - ThermoCoreTests
        - ToolboxUITests
        - LightboxUITests
        - DeskRemoteUITests
  # The miner's UI-free core, embedded as a framework so its sources keep `import MinerStatusCore`.
  MinerStatusCore:
    type: framework
    platform: iOS
    sources:
      - ../miner-status-ios/Sources/MinerStatusCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.lightbox.minerstatuscore
  # The desk remote's UI-free core (API models, helper client, transcript merging), the same way.
  DeskRemoteCore:
    type: framework
    platform: iOS
    sources:
      - ../desk-remote-ios/Sources/DeskRemoteCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.lightbox.deskremotecore
  # The thermometers' UI-free core (gateway JSON, history, names), the same way.
  ThermoCore:
    type: framework
    platform: iOS
    sources:
      - ../thermo-ios/Sources/ThermoCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.lightbox.thermocore
  ThermoCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../thermo-ios/Tests/ThermoCoreTests
    dependencies:
      - target: ThermoCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.lightbox.thermotests
  # The album's, the miner's and the desk remote's own unit tests, unchanged.
  LightboxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../album-ios/Tests
        excludes: [UI]
    dependencies:
      - target: Lightbox
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.lightbox.tests
  MinerStatusCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../miner-status-ios/Tests/MinerStatusCoreTests
    dependencies:
      - target: MinerStatusCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.lightbox.minerstatustests
  DeskRemoteCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../desk-remote-ios/Tests/DeskRemoteCoreTests
    dependencies:
      - target: DeskRemoteCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.lightbox.deskremotetests
  # The toolbox's own UI tests: tabs, switching, the last tool reopening, the miner and the desk
  # remote inside their tabs.
  ToolboxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UI
    dependencies:
      - target: Lightbox
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.lightbox.toolboxuitests
        TEST_TARGET_NAME: Lightbox
  # The album's own UI tests, unchanged, run inside the toolbox (they start in the album tab).
  LightboxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ../album-ios/Tests/UI
    dependencies:
      - target: Lightbox
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.lightbox.uitests
        TEST_TARGET_NAME: Lightbox
  # The desk remote's own UI tests, unchanged, run inside the toolbox against the fake helper
  # that scripts/build.sh serves (they start in the desk remote tab: DESK_UI_TEST).
  DeskRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ../desk-remote-ios/Tests/DeskRemoteUITests
    dependencies:
      - target: Lightbox
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.lightbox.deskremoteuitests
        TEST_TARGET_NAME: Lightbox
