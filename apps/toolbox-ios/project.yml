# XcodeGen spec for the toolbox: one iPhone app holding every tool, so the phone spends one of
# the free Apple account's three app slots and one renewal on all of them.
# Nothing is copied: each tool's sources come straight from its own app folder, minus that app's
# @main entry file, and the standalone apps still build from the same files.
# Generate on a Mac from this directory with `xcodegen generate`; see scripts/build.sh.
name: Toolbox
options:
  bundleIdPrefix: org.personal.lightbox
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: "17.0"
packages:
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2.git
    exactVersion: 4.0.3
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    TARGETED_DEVICE_FAMILY: "1"
    # Continues the album's numbering: the toolbox installs over the album (0.3.2 build 5).
    MARKETING_VERSION: "0.4.1"
    CURRENT_PROJECT_VERSION: "7"
targets:
  # Named Lightbox, as the album app it replaces: the same bundle identifier, executable and
  # Swift module, so the album's unit tests (`@testable import Lightbox`) run here unchanged.
  Lightbox:
    type: application
    platform: iOS
    sources:
      - path: Toolbox
        excludes: [Info.plist]
      - path: ../album-ios/Lightbox
        excludes: [LightboxApp.swift, Info.plist]
      - path: ../miner-status-ios/iOSApp
        excludes: [MinerStatusApp.swift, Info.plist, zh-Hant.lproj]
      - path: ../miner-status-ios/fixtures/demo-running.json
        buildPhase: resources
    dependencies:
      - target: MinerStatusCore
      - package: AMSMB2
        embed: true
      - framework: ../album-ios/Vendor/MobileVLCKit.xcframework
        embed: true
      - sdk: QuartzCore.framework
      - sdk: CoreText.framework
      - sdk: AVFoundation.framework
      - sdk: Security.framework
      - sdk: CFNetwork.framework
      - sdk: AudioToolbox.framework
      - sdk: OpenGLES.framework
      - sdk: CoreGraphics.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: libc++.tbd
      - sdk: libxml2.tbd
      - sdk: libz.tbd
      - sdk: libbz2.tbd
      - sdk: libiconv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.lightbox.album
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Toolbox/Info.plist
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "decoder-*.avi"
    scheme:
      gatherCoverageData: false
      testTargets:
        - LightboxTests
        - MinerStatusCoreTests
        - ToolboxUITests
        - LightboxUITests
  # The miner's UI-free core, embedded as a framework so its sources keep `import MinerStatusCore`.
  MinerStatusCore:
    type: framework
    platform: iOS
    sources:
      - ../miner-status-ios/Sources/MinerStatusCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.lightbox.minerstatuscore
  # The album's and the miner's own unit tests, unchanged.
  LightboxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../album-ios/Tests
        excludes: [UI]
    dependencies:
      - target: Lightbox
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.lightbox.tests
  MinerStatusCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../miner-status-ios/Tests/MinerStatusCoreTests
    dependencies:
      - target: MinerStatusCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.lightbox.minerstatustests
  # The toolbox's own UI tests: tabs, switching, the last tool reopening, the miner inside a tab.
  ToolboxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UI
    dependencies:
      - target: Lightbox
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.lightbox.toolboxuitests
        TEST_TARGET_NAME: Lightbox
  # The album's own UI tests, unchanged, run inside the toolbox (they start in the album tab).
  LightboxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ../album-ios/Tests/UI
    dependencies:
      - target: Lightbox
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.lightbox.uitests
        TEST_TARGET_NAME: Lightbox
