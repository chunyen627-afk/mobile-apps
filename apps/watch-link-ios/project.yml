# XcodeGen spec, same layout as apps/miner-status-ios: app + UI-free core + unit and UI tests.
name: WatchLink
options:
  bundleIdPrefix: org.personal.watchlink
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
packages:
  GoogleNavigation:
    url: https://github.com/googlemaps/ios-navigation-sdk.git
    exactVersion: 10.2.0
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk.git
    exactVersion: 10.2.0
targets:
  WatchLink:
    type: application
    platform: iOS
    sources:
      - path: iOSApp
        excludes: [Info.plist]
    dependencies:
      - target: WatchLinkCore
      - package: GoogleNavigation
      - package: GoogleMaps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.watchlink.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iOSApp/Info.plist
    scheme:
      gatherCoverageData: false
      testTargets:
        - WatchLinkCoreTests
        - WatchLinkUITests
  # Framing, message and weather parsing: no UI and no Bluetooth, so it runs on the simulator.
  WatchLinkCore:
    type: framework
    platform: iOS
    sources:
      - Sources/WatchLinkCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.watchlink.core
  WatchLinkCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/WatchLinkCoreTests
    dependencies:
      - target: WatchLinkCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.watchlink.tests
  WatchLinkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/WatchLinkUITests
    dependencies:
      - target: WatchLink
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.watchlink.uitests
        TEST_TARGET_NAME: WatchLink
