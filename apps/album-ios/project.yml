name: Lightbox
options:
  bundleIdPrefix: org.personal.lightbox
  deploymentTarget:
    iOS: "17.0"
packages:
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2.git
    exactVersion: 4.0.3
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  Lightbox:
    type: application
    platform: iOS
    sources:
      - Lightbox
    dependencies:
      - package: AMSMB2
        embed: true
      - framework: Vendor/MobileVLCKit.xcframework
        embed: true
      - sdk: QuartzCore.framework
      - sdk: CoreText.framework
      - sdk: AVFoundation.framework
      - sdk: Security.framework
      - sdk: CFNetwork.framework
      - sdk: AudioToolbox.framework
      - sdk: OpenGLES.framework
      - sdk: CoreGraphics.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: libc++.tbd
      - sdk: libxml2.tbd
      - sdk: libz.tbd
      - sdk: libbz2.tbd
      - sdk: libiconv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.lightbox.album
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Lightbox/Info.plist
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "decoder-*.avi"
    scheme:
      testTargets:
        - LightboxTests
        - LightboxUITests
  LightboxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [UI]
    dependencies:
      - target: Lightbox
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.lightbox.tests
  LightboxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UI
    dependencies:
      - target: Lightbox
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.lightbox.uitests
        TEST_TARGET_NAME: Lightbox
