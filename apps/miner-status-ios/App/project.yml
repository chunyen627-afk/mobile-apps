# XcodeGen spec for the iOS app. Not yet generated or built: no Xcode was available when written.
# Generate on a Mac from this directory with `xcodegen generate`; see ../scripts/build.sh.
name: MinerStatus
options:
  bundleIdPrefix: org.personal.minerstatus
  deploymentTarget:
    iOS: "16.0"
packages:
  # The SwiftPM package one level up (Package.swift, product MinerStatusCore).
  MinerStatus:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    # iPhone first; iPad layout exists but is unverified.
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MinerStatus:
    type: application
    platform: iOS
    sources:
      - path: ../iOSApp
        excludes: [Info.plist]
      - path: ../fixtures/demo-running.json
        buildPhase: resources
    dependencies:
      - package: MinerStatus
        product: MinerStatusCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.minerstatus.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ../iOSApp/Info.plist
    scheme:
      gatherCoverageData: false
