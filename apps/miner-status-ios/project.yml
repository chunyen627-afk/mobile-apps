# XcodeGen spec, same layout as apps/album-ios: app + unit tests run on an iOS simulator.
# Generate on a Mac from this directory with `xcodegen generate`; see scripts/build.sh.
name: MinerStatus
options:
  bundleIdPrefix: org.personal.minerstatus
  # The app is Traditional Chinese only; system controls (for example the back button) follow it.
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    # iPhone first; iPad layout exists but is unverified.
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "6"
targets:
  MinerStatus:
    type: application
    platform: iOS
    sources:
      - path: iOSApp
        excludes: [Info.plist]
      - path: fixtures/demo-running.json
        buildPhase: resources
    dependencies:
      - target: MinerStatusCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.minerstatus.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iOSApp/Info.plist
    scheme:
      gatherCoverageData: false
      testTargets:
        - MinerStatusCoreTests
        - MinerStatusUITests
  # The UI-free core (Sources/MinerStatusCore), embedded in the app as a framework so the
  # sources keep `import MinerStatusCore`.
  MinerStatusCore:
    type: framework
    platform: iOS
    sources:
      - Sources/MinerStatusCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.minerstatus.core
  # The 80 XCTest methods. Fixtures are read from ../fixtures via #filePath, which the
  # simulator can reach on the build Mac.
  MinerStatusCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/MinerStatusCoreTests
    dependencies:
      - target: MinerStatusCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.minerstatus.tests
  # Simulator UI tests: drive every demo scenario, the detail screen and the custom source.
  MinerStatusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/MinerStatusUITests
    dependencies:
      - target: MinerStatus
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.personal.minerstatus.uitests
        TEST_TARGET_NAME: MinerStatus
