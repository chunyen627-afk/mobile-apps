[platformio]
default_envs = cyd-st7789

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  h2zero/NimBLE-Arduino@2.3.6
  bblanchon/ArduinoJson@6.21.5
  tzapu/WiFiManager@2.0.17
  lovyan03/LovyanGFX@1.2.7
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

[env:cyd-st7789]
build_flags = ${env.build_flags} -DPANEL_ST7789=1

[env:cyd-ili9341]
build_flags = ${env.build_flags} -DPANEL_ST7789=0
