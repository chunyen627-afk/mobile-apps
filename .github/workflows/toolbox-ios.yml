name: Build Toolbox iOS
# Runs only for the toolbox branch. No workflow_dispatch: that needs the file on main.
# The toolbox builds from the album's, the miner's and the desk remote's own folders, so changes
# there run it too.
on:
  push:
    branches: [claude/toolbox-ios]
    paths:
      - 'apps/toolbox-ios/**'
      - 'apps/album-ios/Lightbox/**'
      - 'apps/album-ios/Tests/**'
      - 'apps/album-ios/scripts/**'
      - 'apps/miner-status-ios/iOSApp/**'
      - 'apps/miner-status-ios/Sources/**'
      - 'apps/miner-status-ios/Tests/MinerStatusCoreTests/**'
      - 'apps/miner-status-ios/fixtures/**'
      - 'apps/desk-remote-ios/iOSApp/**'
      - 'apps/desk-remote-ios/Sources/**'
      - 'apps/desk-remote-ios/Tests/**'
      - 'apps/desk-remote-ios/fixtures/**'
      - 'apps/desk-remote-ios/pc-helper/**'
      - 'apps/thermo-ios/**'
      - '.github/workflows/toolbox-ios.yml'
# Write access is used only to publish an approved release and to force-push simulator
# screenshots (fixture and demo data only) to one dedicated branch.
permissions:
  contents: write
concurrency:
  group: toolbox-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Fail closed for private repositories; standard public runners are free.
    if: github.event.repository.private == false
    runs-on: macos-15
    # About 14 minutes before the desk remote joined; its 41 UI tests add about 16.
    timeout-minutes: 80
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      APP_DIR: apps/toolbox-ios
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Helper tests, build, unit and UI tests
        working-directory: ${{ env.APP_DIR }}
        run: bash scripts/build.sh
      # The IPA stays on the runner unless the build is approved for release.
      - name: Record IPA size and SHA256
        working-directory: ${{ env.APP_DIR }}/build
        run: |
          size=$(stat -f %z Toolbox-unsigned.ipa)
          sha=$(cut -d' ' -f1 Toolbox-unsigned.ipa.sha256)
          echo "::notice title=IPA (not uploaded)::size ${size} bytes, SHA256 ${sha}"
          {
            echo "### Toolbox-unsigned.ipa (not uploaded)"
            echo "- size: $size bytes"
            echo "- SHA256: \`$sha\`"
            grep -E "Executed [0-9]+ tests?, with [0-9]+ failures" test-summary.txt | sed 's/^/- XCTest: /'
          } >> "$GITHUB_STEP_SUMMARY"
      # Public prerelease of the tested IPA plus its crash symbols, only when the head commit message
      # contains [release-ipa]; that marker is added only after the user approves the release. The
      # IPA is about 50 MB because of the album's VLC framework (the user approved it); 100 MB cap.
      - name: Publish IPA release (approved builds only)
        if: success() && contains(github.event.head_commit.message, '[release-ipa]')
        working-directory: ${{ env.APP_DIR }}/build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plist=Toolbox.xcarchive/Products/Applications/Lightbox.app/Info.plist
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
          tag="toolbox-${version}-build${build}"
          asset="Toolbox-${version}-build${build}-unsigned.ipa"
          symbols="Toolbox-${version}-build${build}-crash-symbols.zip"
          cp Toolbox-unsigned.ipa "$asset"
          (cd Toolbox.xcarchive && /usr/bin/zip -qr "../$symbols" dSYMs)
          size=$(stat -f %z "$asset")
          if [ "$size" -gt 104857600 ]; then
            echo "IPA exceeds 100 MB; refusing to publish."
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; raise CURRENT_PROJECT_VERSION before releasing again."
            exit 1
          fi
          sha=$(shasum -a 256 "$asset" | cut -d' ' -f1)
          notes=$(printf '%s\n' \
            "未簽署 IPA，需用自己的 Apple 帳號簽署後安裝。沿用相簿的 Bundle ID，覆蓋安裝會保留相簿與礦機設定；只含模擬器測試資料與離線示範資料，不含任何真實位址、密碼或金鑰。" \
            "桌面遙控分頁要重新配對電腦（單獨的桌面遙控 App 的設定不會帶過來）；電腦端小幫手在 apps/desk-remote-ios/pc-helper。" \
            "溫濕度分頁要在設定填入閘道網址；閘道程式在 apps/thermo-ios/pc-gateway。" \
            "" \
            "- 來源 commit：${GITHUB_SHA}" \
            "- 建置與測試：run ${GITHUB_RUN_ID}（小幫手、溫濕度閘道、相簿、礦機、桌面遙控與溫濕度的單元測試，工具箱（含溫濕度分頁）、相簿與桌面遙控的模擬器 UI 測試皆通過才發布）" \
            "- 大小：${size} bytes" \
            "- SHA256：${sha}" \
            "- ${symbols}：閃退分析用符號檔")
          gh release create "$tag" "$asset" "$symbols" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "工具箱 ${version}（build ${build}）" --notes "$notes"
          echo "::notice title=IPA release::${tag} ${asset} size ${size} bytes, SHA256 ${sha}"
      - name: Collect small reports (1 MB limit)
        id: collect
        if: always()
        working-directory: ${{ env.APP_DIR }}/build
        run: |
          mkdir -p reports
          for f in test-summary.txt desk-helper-tests.log fake-helper.log thermo-gateway-tests.log fake-thermo-gateway.log; do [ -f "$f" ] && cp "$f" reports/; done
          ls -l reports
          total=$(find reports -type f -exec stat -f %z {} + | awk '{s+=$1} END {print s+0}')
          echo "reports total: $total bytes"
          if [ "$total" -gt 1048576 ]; then
            echo "Reports exceed 1 MB; refusing to upload."
            exit 1
          fi
      # Replaces the branch each run (no history kept). Only fixture and demo screens; 10 MB cap
      # (the desk remote's own screenshots, about 4.8 MB, are taken here too).
      - name: Publish simulator screenshots
        if: always()
        working-directory: ${{ env.APP_DIR }}/build
        env:
          SHOT_BRANCH: ci-screenshots-toolbox-ios
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f screenshots-ui/INDEX.txt ]; then
            echo "No UI screenshots to publish."
            exit 0
          fi
          total=$(find screenshots-ui -type f -exec stat -f %z {} + | awk '{s+=$1} END {print s+0}')
          echo "screenshots total: $total bytes"
          if [ "$total" -gt 10485760 ]; then
            echo "Screenshots exceed 10 MB; refusing to publish."
            exit 1
          fi
          cd screenshots-ui
          printf 'run %s\ncommit %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > RUN.txt
          git init -q -b "$SHOT_BRANCH"
          git add .
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -q -m "Simulator screenshots for run $GITHUB_RUN_ID ($GITHUB_SHA)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${SHOT_BRANCH}"
          echo "::notice title=Screenshots::$(grep -c . INDEX.txt) screenshots on branch ${SHOT_BRANCH} for run ${GITHUB_RUN_ID}"
      - name: Save small reports
        if: always() && steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Toolbox-reports
          path: ${{ env.APP_DIR }}/build/reports
          if-no-files-found: warn
          retention-days: 1
  # The same build and every test on the newest iPad mini simulator, with the newest Xcode and
  # iPadOS on the macos-26 image, plus the iPad layout shots (Tests/UI/IPadLayoutShots.swift).
  # Only for approved releases ([release-ipa]) or when asked with [ipad], so everyday pushes stay
  # as fast as before; it runs beside the iPhone job and publishes nothing but its screenshots.
  ipad:
    if: >-
      github.event.repository.private == false &&
      (contains(github.event.head_commit.message, '[release-ipa]') || contains(github.event.head_commit.message, '[ipad]'))
    runs-on: macos-26
    # Every test plus the layout shots on the slower arm64 iPad simulator ran past 90 minutes once.
    timeout-minutes: 150
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      APP_DIR: apps/toolbox-ios
      SIM_MATCH: iPad mini
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          echo "::notice title=Xcode::$xcode $(xcodebuild -version | tr '\n' ' ')"
      - name: Install project generator
        run: brew install xcodegen
      - name: Helper tests, build, unit and UI tests on an iPad mini
        working-directory: ${{ env.APP_DIR }}
        timeout-minutes: 130
        run: bash scripts/build.sh
      # Public runs show no logs without a token, so the test timings go into annotations: the last
      # test started (if the step was stopped), the slowest ones and every failure.
      - name: Report the iPad test timings
        if: always()
        working-directory: ${{ env.APP_DIR }}/build
        run: |
          [ -f xcodebuild-test.log ] || exit 0
          last=$(grep -E "^Test Case '.*' started" xcodebuild-test.log | tail -n 1)
          slow=$(grep -E "^Test Case '.*' (passed|failed) \(" xcodebuild-test.log \
            | sed -E "s/^Test Case '-\[([^]]*)\]' (passed|failed) \(([0-9.]+) seconds\).*/\3s \2 \1/" \
            | sort -rn | head -n 15 | paste -sd ';' -)
          failed=$(grep -E "^Test Case '.*' failed" xcodebuild-test.log \
            | sed -E "s/^Test Case '-\[([^]]*)\]'.*/\1/" | paste -sd ';' -)
          errors=$(grep -E ": error: -\[" xcodebuild-test.log | sed -E 's/^.*: error: //' | cut -c1-200 | head -n 20 | paste -sd ';' -)
          echo "::notice title=Last test started::${last:-none}"
          echo "::notice title=Slowest tests::${slow:-none}"
          echo "::notice title=Failed tests::${failed:-none}"
          echo "::notice title=Test errors::${errors:-none}"
      - name: Report the iPad's screen
        if: always()
        working-directory: ${{ env.APP_DIR }}/build
        run: |
          line=$(grep -h -m1 'IPAD-SCREEN' xcodebuild-test.log || true)
          echo "::notice title=iPad screen::${line:-not recorded}"
      # Replaces the branch each run, like the iPhone screenshots; 15 MB cap (iPad shots are larger).
      - name: Publish iPad simulator screenshots
        if: always()
        working-directory: ${{ env.APP_DIR }}/build
        env:
          SHOT_BRANCH: ci-screenshots-toolbox-ios-ipad
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f screenshots-ui/INDEX.txt ]; then
            echo "No UI screenshots to publish."
            exit 0
          fi
          total=$(find screenshots-ui -type f -exec stat -f %z {} + | awk '{s+=$1} END {print s+0}')
          echo "screenshots total: $total bytes"
          if [ "$total" -gt 15728640 ]; then
            echo "Screenshots exceed 15 MB; refusing to publish."
            exit 1
          fi
          cd screenshots-ui
          printf 'run %s\ncommit %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > RUN.txt
          git init -q -b "$SHOT_BRANCH"
          git add .
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -q -m "iPad simulator screenshots for run $GITHUB_RUN_ID ($GITHUB_SHA)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${SHOT_BRANCH}"
          echo "::notice title=Screenshots::$(grep -c . INDEX.txt) iPad screenshots on branch ${SHOT_BRANCH} for run ${GITHUB_RUN_ID}"
